<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo sản lượng Xưởng 2 - Chi Nhánh (NS1)</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#1d2330; --muted:#6b7280; --line:#e3e6eb; --head:#f0f2f5;
  --accent:#2f6fde; --accent-soft:#e6eefc;
  /* thang phân kỳ xanh dương (tốt hơn TB) ↔ cam đất (kém hơn TB), giữa là trung tính — an toàn cho người mù màu */
  --good:#2a78d6; --bad:#c4501f;
  --up2:#cfe1f8; --up1:#eaf2fc; --flat:transparent; --dn1:#fdebe2; --dn2:#f8cfbc;
  --bar:#b9c3d1; --avg:#1d2330; --prev:#9aa3b2; --row-hover:#f6f8fb; --sec:#f3f5f8;
  --warn:#b45309; --warn-bg:#fff4e0;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#13161c; --card:#1c2029; --ink:#e7e9ee; --muted:#9aa3b2; --line:#2c323e; --head:#232835;
    --accent:#6d9bf0; --accent-soft:#22304d;
    --good:#5b9bea; --bad:#ec835a;
    --up2:#1e3a5c; --up1:#1a2b40; --flat:transparent; --dn1:#3a261d; --dn2:#552f1f;
    --bar:#4a5363; --avg:#e7e9ee; --prev:#6b7280; --row-hover:#222734; --sec:#20252f;
    --warn:#f0b35a; --warn-bg:#3a2d17;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);font-size:12px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .lb{color:var(--muted);font-size:12px}
.kpi .v{font-size:22px;font-weight:700;margin:2px 0}
.kpi .d{font-size:12px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--head);position:sticky;top:0;z-index:1;text-align:center;font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td.name{position:sticky;left:0;background:var(--card);z-index:1;min-width:220px}
th.name{position:sticky;left:0;z-index:2;text-align:left}
tr.grp td{background:var(--head);font-weight:700}
.cell{cursor:pointer}
.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
.c-up2{background:var(--up2)} .c-up1{background:var(--up1)}
.c-dn1{background:var(--dn1)} .c-dn2{background:var(--dn2)}
.c-none{color:var(--muted)}
.avgcol{font-weight:700}
/* ---- bảng tổng hợp (ma trận) ---- */
#matrix{font-size:13px}
#matrix th{background:var(--card);color:var(--muted);font-weight:600;font-size:12px;padding:10px 8px;border-bottom:2px solid var(--line)}
#matrix th.day b{display:block;color:var(--ink);font-size:13px}
#matrix th.today{color:var(--accent)} #matrix th.today b{color:var(--accent)}
#matrix td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
#matrix tbody tr:not(.sec):hover td{background-color:var(--row-hover)}
#matrix tbody tr:not(.sec):hover td.c-up1,#matrix tbody tr:not(.sec):hover td.c-up2,#matrix tbody tr:not(.sec):hover td.c-dn1,#matrix tbody tr:not(.sec):hover td.c-dn2{filter:brightness(.97)}
#matrix tr.sec td{background:var(--sec);font-weight:700;font-size:13px;padding:7px 10px;border-left:4px solid var(--accent);color:var(--ink)}
#matrix td.cdn{font-weight:600;color:var(--ink);vertical-align:top;padding-top:10px;min-width:90px;background:var(--card);position:sticky;left:0;z-index:1}
#matrix td.ph{min-width:190px;white-space:normal;line-height:1.3}
#matrix td.ph small{display:block;color:var(--muted);font-size:11px}
#matrix td.cell{text-align:right;min-width:78px;font-variant-numeric:tabular-nums;border-left:1px solid var(--card)}
#matrix td.cell .v{display:block;font-weight:500}
#matrix td.cell .dv{display:block;font-size:11px;line-height:1.2;color:var(--muted)}
#matrix .g{color:var(--good)!important} #matrix .b{color:var(--bad)!important}
#matrix td.sep{border-left:2px solid var(--line)}
#matrix td.tot{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
#matrix td.avg{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
#matrix td.cmp{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
#matrix td.cmp .dv{display:block;font-size:11px}
.scale{display:inline-flex;align-items:center;gap:6px}
.scale span.sw{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.scale span.sw i{width:22px;height:12px;border:0;margin:0;border-radius:0}
.toggle{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12px;color:var(--muted);margin:8px 0}
.legend i{display:inline-block;width:14px;height:12px;border-radius:3px;vertical-align:middle;margin-right:4px;border:1px solid var(--line)}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ch{border:1px solid var(--line);border-radius:10px;padding:10px}
.ch .t{font-weight:600;font-size:13px}
.ch .s{color:var(--muted);font-size:12px}
.ch svg{width:100%;height:auto;display:block;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12px}
.chip b{cursor:pointer;margin-left:6px}
.warns li{margin:3px 0}
.warn{color:var(--warn)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--warn-bg);color:var(--warn)}
#detail th{cursor:pointer}
#detail td.gc{white-space:normal;min-width:180px;max-width:320px}
.state{padding:40px;text-align:center;color:var(--muted)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 8px;border-radius:6px;font-size:12px;z-index:9;display:none;max-width:260px;white-space:pre-line}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media (max-width:900px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Báo cáo sản lượng tuần</h1>
      <div class="sub" id="meta">Đang tải dữ liệu…</div>
    </div>
    <div class="ctrls">
      <button id="prevW" title="Tuần trước">◀</button>
      <select id="weekSel"></select>
      <button id="nextW" title="Tuần sau">▶</button>
      <select id="chSel"><option value="">Tất cả chuyền</option></select>
      <button id="reload" title="Tải lại dữ liệu mới nhất">⟳ Tải lại</button>
    </div>
  </div>

  <div id="app" class="state">Đang tải dữ liệu từ Google Sheet…</div>
</div>
<div class="tip" id="tip"></div>

<script>
/* ================== NGUỒN DỮ LIỆU ==================
   GAS_URL: dán link Web App Apps Script (kết thúc bằng /exec) để trang đọc trực tiếp ?format=json
   (dùng khi trang chạy trên GitHub Pages / dangquocsu.id.vn).
   Để trống => dùng "/api/data" của Cloudflare Worker (khi chạy qua Worker.js). */
const GAS_URL = "https://script.google.com/macros/s/AKfycbzU5Tz1t37Tc5TJvYv8kNYHj8B7E5JtX2v8nYujcr_m_kjm-l1fQGyK5zvewXBxzAB1/exec";

/* ================== DỮ LIỆU ================== */
const DOW = ['T2','T3','T4','T5','T6','T7','CN'];
const METRICS = {
  sl:   {lb:'Sản lượng', good:'up', fmt:v=>fmtN(v)},
  loi:  {lb:'Lỗi sửa',   good:'down', fmt:v=>fmtN(v)},
  ll:   {lb:'Làm lại',   good:'down', fmt:v=>fmtN(v)},
  rate: {lb:'% Lỗi (sửa + làm lại)', good:'down', fmt:v=>v==null?'':v.toFixed(1)+'%'}
};
const S = { showDev:true, metric:'sl', base:'week', week:null, ch:'', filter:null, q:'', sort:{k:'d',dir:1} };
let D = null; // dữ liệu đã chuẩn hoá

function fmtN(v){ return v==null? '' : Math.round(v).toLocaleString('vi-VN'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
function iso(dt){ return dt.toISOString().slice(0,10); }
function addDays(s,n){ const d=toDate(s); d.setUTCDate(d.getUTCDate()+n); return iso(d); }
function monday(s){ const d=toDate(s); const w=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-w); return iso(d); }
function isoWeek(s){ const d=toDate(s); d.setUTCDate(d.getUTCDate()+3-((d.getUTCDay()+6)%7)); const y=d.getUTCFullYear(); const j=new Date(Date.UTC(y,0,4)); return {y, w:1+Math.round(((d-j)/864e5-3+((j.getUTCDay()+6)%7))/7)}; }
function dm(s){ return s.slice(8,10)+'/'+s.slice(5,7); }
function dmy(s){ return s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4); }

function prepare(raw){
  const chOrder = {}; raw.chuyen.forEach((c,i)=>chOrder[c.ma]=i);
  const chName = {}; raw.chuyen.forEach(c=>chName[c.ma]=c.ten||c.ma);
  const cdOrder = {}, cdName = {}, cdCh = {};
  raw.nhom.forEach((n,i)=>{cdOrder[n.ma]=i; cdName[n.ma]=n.ten||n.ma; cdCh[n.ma]=n.ch;});
  const phOrder = {}, phName = {};
  raw.phoi.forEach((p,i)=>{phOrder[p.ma]=i; phName[p.ma]=p.ten||p.ma;});
  const recs=[], bad=[];
  raw.rows.forEach(r=>{
    const o={id:r[0],ch:r[1],cd:r[2],ph:r[3],d:r[4],sl:+r[5]||0,loi:+r[6]||0,ll:+r[7]||0,gc:r[8],nbc:r[9],tg:r[10]};
    if(!/^\d{4}-\d{2}-\d{2}$/.test(o.d) || !o.cd || !o.ph){ bad.push(o); return; }
    if(!o.ch) o.ch = cdCh[o.cd]||'';
    o.lag = o.tg && /^\d{4}-\d{2}-\d{2}/.test(o.tg) ? Math.round((toDate(o.tg.slice(0,10))-toDate(o.d))/864e5) : null;
    recs.push(o);
  });
  // gộp theo dòng (công đoạn × phôi) và ngày
  const lines = {}, agg = {};
  recs.forEach(o=>{
    const k=o.cd+'|'+o.ph;
    if(!lines[k]) lines[k]={k,ch:o.ch,cd:o.cd,ph:o.ph};
    const a=(agg[k]=agg[k]||{})[o.d]=(agg[k][o.d]||{sl:0,loi:0,ll:0,n:0});
    a.sl+=o.sl; a.loi+=o.loi; a.ll+=o.ll; a.n++;
  });
  const big=1e6;
  const lineList = Object.values(lines).sort((a,b)=>
    ((chOrder[a.ch]??big)-(chOrder[b.ch]??big)) || ((cdOrder[a.cd]??big)-(cdOrder[b.cd]??big)) ||
    ((phOrder[a.ph]??big)-(phOrder[b.ph]??big)) || a.ph.localeCompare(b.ph));
  const weeks = [...new Set(recs.map(o=>monday(o.d)))].sort();
  const chs = [...new Set(lineList.map(l=>l.ch))];
  return {recs,bad,agg,lineList,weeks,chs,chName,cdName,phName,cdOrder,generatedAt:raw.generatedAt};
}

/* ---------- tính toán ---------- */
function val(a,m){ if(!a) return null;
  if(m==='rate') return a.sl? (a.loi+a.ll)/a.sl*100 : null;
  return a[m]; }
function weekDays(mon){ return [0,1,2,3,4,5,6].map(i=>addDays(mon,i)); }
function lineWeek(k,mon,m){
  const days=weekDays(mon), A=D.agg[k]||{};
  const vals=days.map(d=>val(A[d],m));
  const tot={sl:0,loi:0,ll:0}; let nd=0;
  days.forEach(d=>{const a=A[d]; if(a){tot.sl+=a.sl;tot.loi+=a.loi;tot.ll+=a.ll;nd++;}});
  let total = m==='rate'? (tot.sl?(tot.loi+tot.ll)/tot.sl*100:null) : (nd? tot[m]:null);
  let avg = m==='rate'? total : (nd? tot[m]/nd : null);
  return {vals,total,avg,nd,tot};
}
function baseline(k,m){
  if(S.base==='week') return lineWeek(k,S.week,m).avg;
  // TB 4 tuần trước (theo ngày có báo cáo)
  let s={sl:0,loi:0,ll:0}, nd=0;
  for(let i=1;i<=4;i++){ const w=lineWeek(k,addDays(S.week,-7*i),m); if(w.nd){nd+=w.nd; s.sl+=w.tot.sl; s.loi+=w.tot.loi; s.ll+=w.tot.ll;} }
  if(!nd) return null;
  if(m==='rate') return s.sl? (s.loi+s.ll)/s.sl*100 : null;
  return s[m]/nd;
}
function cls(v,b,m){
  if(v==null) return 'c-none';
  if(b==null || b===0) return '';
  let r = m==='rate' ? (v-b) : (v/b-1)*100;   // % lệch (rate: lệch điểm %)
  const th1 = m==='rate'? 1 : 5, th2 = m==='rate'? 3 : 15;
  if(METRICS[m].good==='down') r=-r;
  if(r>=th2) return 'c-up2'; if(r>=th1) return 'c-up1';
  if(r<=-th2) return 'c-dn2'; if(r<=-th1) return 'c-dn1'; return '';
}
function visibleLines(){ return D.lineList.filter(l=>!S.ch || l.ch===S.ch); }

/* ================== GIAO DIỆN ================== */
function weekLabel(mon){ const w=isoWeek(mon); return `Tuần ${w.w}/${w.y} (${dm(mon)} – ${dmy(addDays(mon,6))})`; }

function render(){
  const app=document.getElementById('app'); app.className='';
  const lines=visibleLines();
  const days=weekDays(S.week);
  const hasSun = lines.some(l=>(D.agg[l.k]||{})[days[6]]);
  const shown = hasSun? days : days.slice(0,6);
  app.innerHTML = kpiHTML(lines) + matrixHTML(lines,shown) +
    `<div class="row2">${chartsHTML(lines,shown)}${warnHTML(lines)}</div>` + detailHTML();
  bind();
}

function kpiHTML(lines){
  // KPI: sản lượng công đoạn cuối mỗi chuyền + tỷ lệ lỗi chung
  const prev=addDays(S.week,-7); let out='';
  const byCh={};
  lines.forEach(l=>{ (byCh[l.ch]=byCh[l.ch]||[]).push(l); });
  Object.keys(byCh).forEach(ch=>{
    const ls=byCh[ch]; const lastCd=ls.map(l=>l.cd).sort((a,b)=>(D.cdOrder[a]??0)-(D.cdOrder[b]??0)).pop();
    const lastLines=ls.filter(l=>l.cd===lastCd);
    // so sánh theo TB/ngày có báo cáo để tuần đang chạy (chưa đủ ngày) không bị lệch
    const sumDays=(w)=>{const ds=new Set(); let s=0; lastLines.forEach(l=>{const A=D.agg[l.k]||{}; weekDays(w).forEach(d=>{if(A[d]){s+=A[d].sl; ds.add(d);}});}); return {s,n:ds.size};};
    const c=sumDays(S.week), p=sumDays(prev);
    const ca=c.n? c.s/c.n : 0, pa=p.n? p.s/p.n : null;
    const dl = pa? (ca/pa-1)*100 : null;
    out+=`<div class="kpi"><div class="lb">${esc(D.chName[ch]||ch)} · ${esc(D.cdName[lastCd]||lastCd)} (tổng tuần)</div>
      <div class="v">${fmtN(c.s)}</div>
      <div class="d">TB/ngày ${fmtN(ca)} <span class="${dl==null?'':dl>=0?'pos':'neg'}">${dl==null?'':(dl>=0?'▲ ':'▼ ')+Math.abs(dl).toFixed(1)+'%'}</span><br><span class="sub">${c.n} ngày có BC · tuần trước TB ${pa==null?'–':fmtN(pa)}/ngày</span></div></div>`;
  });
  const t={sl:0,e:0}, tp={sl:0,e:0};
  lines.forEach(l=>{ const a=lineWeek(l.k,S.week,'sl').tot, b=lineWeek(l.k,prev,'sl').tot; t.sl+=a.sl; t.e+=a.loi+a.ll; tp.sl+=b.sl; tp.e+=b.loi+b.ll; });
  const r=t.sl? t.e/t.sl*100:0, rp=tp.sl? tp.e/tp.sl*100:null;
  out+=`<div class="kpi"><div class="lb">% Lỗi chung (sửa + làm lại)</div><div class="v">${r.toFixed(2)}%</div>
    <div class="d ${rp==null?'':r<=rp?'pos':'neg'}">${rp==null?'':(r<=rp?'▼ ':'▲ ')+Math.abs(r-rp).toFixed(2)+' điểm so với tuần trước'}</div></div>`;
  const nRep=D.recs.filter(o=>o.d>=S.week&&o.d<=addDays(S.week,6)&&(!S.ch||o.ch===S.ch)).length;
  out+=`<div class="kpi"><div class="lb">Số phiếu báo cáo trong tuần</div><div class="v">${nRep}</div><div class="d sub">${lines.length} dòng công đoạn × mã hàng</div></div>`;
  return `<div class="kpis">${out}</div>`;
}

function spark(k,m){
  const ws=[]; for(let i=7;i>=0;i--) ws.push(addDays(S.week,-7*i));
  const v=ws.map(w=>lineWeek(k,w,m).avg);
  const nums=v.filter(x=>x!=null); if(nums.length<2) return '';
  const mx=Math.max(...nums), mn=Math.min(...nums), W=90, H=22;
  const pts=v.map((x,i)=>x==null?null:[i*(W/7), H-2-((x-mn)/((mx-mn)||1))*(H-4)]);
  let p='', started=false; pts.forEach(q=>{ if(!q){started=false;return;} p+=(started?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1); started=true; });
  const last=pts[7];
  return `<svg width="${W}" height="${H}" viewBox="-2 0 ${W+4} ${H}"><path d="${p}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>${last?`<circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="var(--accent)"/>`:''}</svg>`;
}

function devTxt(v,b,m){
  if(v==null||b==null||b===0) return '';
  const d = m==='rate'? v-b : (v/b-1)*100;
  if(Math.abs(d) < (m==='rate'?0.05:0.5)) return '≈ TB';
  return (d>0?'▲ ':'▼ ')+Math.abs(d).toFixed(m==='rate'?1:0)+(m==='rate'?' đ':'%');
}
function devCls(c){ return c==='c-up1'||c==='c-up2'?'g':c==='c-dn1'||c==='c-dn2'?'b':''; }
function matrixHTML(lines,shown){
  const m=S.metric, F=METRICS[m].fmt, today=new Date().toISOString().slice(0,10);
  const t1=m==='rate'?'1 điểm':'5%', t2=m==='rate'?'3 điểm':'15%';
  let h=`<div class="card"><div class="top" style="margin-bottom:4px"><h2 style="margin:0">Bảng tổng hợp theo ngày — ${weekLabel(S.week)}</h2>
    <div class="ctrls"><span class="seg">${Object.keys(METRICS).map(k=>`<button data-metric="${k}" class="${k===m?'on':''}">${METRICS[k].lb}</button>`).join('')}</span>
    <select id="baseSel"><option value="week"${S.base==='week'?' selected':''}>So với: TB tuần này</option><option value="prev4"${S.base==='prev4'?' selected':''}>So với: TB 4 tuần trước</option></select>
    <label class="toggle"><input type="checkbox" id="devChk"${S.showDev?' checked':''}> Hiện % lệch</label></div></div>
    <div class="legend"><span class="scale">Kém hơn TB <span class="sw"><i style="background:var(--dn2)"></i><i style="background:var(--dn1)"></i><i style="background:var(--card)"></i><i style="background:var(--up1)"></i><i style="background:var(--up2)"></i></span> Tốt hơn TB</span>
    <span>(nhạt: lệch ${t1}–${t2} · đậm: lệch ≥ ${t2})</span><span>· Bấm vào ô để xem phiếu chi tiết · TB/ngày tính trên số ngày có báo cáo</span></div>
    <div class="tbl-wrap"><table id="matrix"><thead><tr><th class="name" style="text-align:left">Công đoạn</th><th style="text-align:left">Mã hàng</th>
    ${shown.map((d,i)=>`<th class="day${d===today?' today':''}"><b>${DOW[i]}</b>${dm(d)}</th>`).join('')}
    <th class="sep" style="text-align:right">${m==='rate'?'Cả tuần':'Tổng tuần'}</th><th style="text-align:right">TB/ngày</th><th style="text-align:right">${S.base==='week'?'TB tuần trước':'TB 4 tuần trước'}</th><th>Xu hướng 8 tuần</th></tr></thead><tbody>`;
  const ncol=shown.length+6;
  let i=0;
  while(i<lines.length){
    const l0=lines[i];
    if(i===0||lines[i-1].ch!==l0.ch) h+=`<tr class="sec"><td colspan="${ncol}">Chuyền ${esc(D.chName[l0.ch]||l0.ch)}</td></tr>`;
    let j=i; while(j<lines.length && lines[j].ch===l0.ch && lines[j].cd===l0.cd) j++;
    for(let r=i;r<j;r++){
      const l=lines[r], w=lineWeek(l.k,S.week,m), b=baseline(l.k,m);
      const cmp = S.base==='week'? lineWeek(l.k,addDays(S.week,-7),m).avg : b;
      h+='<tr>';
      if(r===i) h+=`<td class="cdn" rowspan="${j-i}">${esc(D.cdName[l.cd]||l.cd)}</td>`;
      h+=`<td class="ph">${esc(D.phName[l.ph]||l.ph)}<small>${esc(l.ph)}</small></td>`;
      shown.forEach((d,k)=>{ const v=w.vals[k]; const a=(D.agg[l.k]||{})[d]; const c=cls(v,b,m);
        const tipTxt = a? `${dmy(d)}\nSản lượng: ${fmtN(a.sl)}\nLỗi sửa: ${fmtN(a.loi)} · Làm lại: ${fmtN(a.ll)}\nSố phiếu: ${a.n}`+(b!=null&&v!=null?`\nSo với TB (${F(b)}): ${devTxt(v,b,m)}`:'') : 'Không có báo cáo';
        h+=`<td class="cell ${c}" data-k="${esc(l.k)}" data-d="${d}" data-tip="${esc(tipTxt)}">${v==null?'<span class="v c-none">·</span>':`<span class="v">${F(v)}</span>${S.showDev?`<span class="dv ${devCls(c)}">${devTxt(v,b,m)||'&nbsp;'}</span>`:''}`}</td>`; });
      const dw = (cmp!=null && w.avg!=null)? devTxt(w.avg,cmp,m) : '';
      const dwc = devCls(cls(w.avg,cmp,m));
      h+=`<td class="tot sep">${w.total==null?'–':F(w.total)}</td><td class="avg">${w.avg==null?'–':F(w.avg)}</td>
        <td class="cmp">${cmp==null?'–':F(cmp)}${dw&&S.base==='week'?`<span class="dv ${dwc}">${dw}</span>`:''}</td><td>${spark(l.k,m)}</td></tr>`;
    }
    i=j;
  }
  if(!lines.length) h+=`<tr><td colspan="${ncol}" class="state">Không có dữ liệu</td></tr>`;
  return h+'</tbody></table></div></div>';
}

function chartsHTML(lines,shown){
  const m=S.metric, F=METRICS[m].fmt;
  let h=`<div class="card"><h2>Biểu đồ theo công đoạn — ${METRICS[m].lb}</h2>
   <div class="legend"><span><i style="background:var(--good)"></i>Tốt hơn TB</span><span><i style="background:var(--bar)"></i>≈ TB</span><span><i style="background:var(--bad)"></i>Kém hơn TB</span><span><i style="background:var(--avg);height:2px"></i>TB tuần này</span><span><i style="background:var(--prev)"></i>${S.base==='week'?'TB tuần trước':'TB 4 tuần trước'}</span></div><div class="charts">`;
  lines.forEach(l=>{
    const w=lineWeek(l.k,S.week,m), b=baseline(l.k,m);
    const ref = S.base==='week'? lineWeek(l.k,addDays(S.week,-7),m).avg : b;
    const vals=w.vals.slice(0,shown.length);
    const mx=Math.max(1,...vals.filter(x=>x!=null), w.avg||0, ref||0)*1.12;
    const W=320,H=150,L=44,B=22,T=8, cw=(W-L-6)/shown.length, y=v=>T+(H-T-B)*(1-v/mx);
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(D.phName[l.ph]||l.ph)}">`;
    [0,0.5,1].forEach(f=>{ const yy=y(mx/1.12*f); s+=`<line x1="${L}" x2="${W-4}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L-4}" y="${yy+3}" font-size="9" text-anchor="end" fill="var(--muted)">${m==='rate'?(mx/1.12*f).toFixed(1):compact(mx/1.12*f)}</text>`; });
    vals.forEach((v,i)=>{ const x=L+i*cw+cw*0.18, bw=cw*0.64;
      const c=cls(v,b,m); const col = c==='c-up2'||c==='c-up1'?'var(--good)':c==='c-dn2'||c==='c-dn1'?'var(--bad)':'var(--bar)'; const op = c==='c-up1'||c==='c-dn1'?0.5:1;
      if(v!=null) s+=`<rect class="cell" data-k="${esc(l.k)}" data-d="${shown[i]}" data-tip="${esc(dmy(shown[i])+': '+F(v))}" x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0,H-B-y(v))}" rx="3" fill="${col}" fill-opacity="${op}"/>`;
      s+=`<text x="${x+bw/2}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${DOW[i]}</text>`; });
    if(ref!=null) s+=`<line x1="${L}" x2="${W-4}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--prev)" stroke-dasharray="2 3" stroke-width="1.5"/>`;
    if(w.avg!=null) s+=`<line x1="${L}" x2="${W-4}" y1="${y(w.avg)}" y2="${y(w.avg)}" stroke="var(--avg)" stroke-dasharray="6 4" stroke-width="2"/>`;
    s+='</svg>';
    const dl = (ref && w.avg!=null && m!=='rate')? ((w.avg/ref-1)*100) : null;
    h+=`<div class="ch"><div class="t">${esc(D.cdName[l.cd]||l.cd)} · ${esc(D.phName[l.ph]||l.ph)}</div>
      <div class="s">${m==='rate'?'Cả tuần':'Tổng'}: <b>${w.total==null?'–':F(w.total)}</b> · TB/ngày: <b>${w.avg==null?'–':F(w.avg)}</b>${dl==null?'':` · <span class="${(METRICS[m].good==='up'?dl>=0:dl<=0)?'pos':'neg'}">${dl>=0?'▲':'▼'} ${Math.abs(dl).toFixed(1)}%</span>`}</div>${s}</div>`;
  });
  return h+'</div></div>';
}
function compact(v){ return v>=1e6?(v/1e6).toFixed(1)+'tr':v>=1e3?(v/1e3).toFixed(v>=1e4?0:1)+'k':Math.round(v); }

function warnHTML(lines){
  const days=weekDays(S.week), end=days[6], ks=new Set(lines.map(l=>l.k));
  const wr=D.recs.filter(o=>o.d>=S.week&&o.d<=end&&ks.has(o.cd+'|'+o.ph));
  const items=[];
  const late=wr.filter(o=>o.lag!=null&&o.lag>=2);
  if(late.length) items.push(`<b>${late.length}</b> phiếu nhập trễ ≥ 2 ngày so với ngày báo cáo <a href="#" data-flt="late">xem</a>`);
  const hiErr=wr.filter(o=>o.sl&&(o.loi+o.ll)/o.sl>0.1);
  if(hiErr.length) items.push(`<b>${hiErr.length}</b> phiếu có % lỗi > 10% <a href="#" data-flt="err">xem</a>`);
  const dup={}; wr.forEach(o=>{const k=o.cd+'|'+o.ph+'|'+o.d; dup[k]=(dup[k]||0)+1;});
  const dk=Object.keys(dup).filter(k=>dup[k]>1);
  if(dk.length) items.push(`<b>${dk.length}</b> trường hợp 1 mã hàng có nhiều phiếu trong cùng ngày (đã cộng dồn) <a href="#" data-flt="dup">xem</a>`);
  // ngày thiếu báo cáo (T2–T7) với dòng có báo cáo trong tuần
  const miss=[]; lines.forEach(l=>{ const A=D.agg[l.k]||{}; const has=days.some(d=>A[d]); if(!has) return;
    const today=new Date().toISOString().slice(0,10);
    days.slice(0,6).forEach(d=>{ if(!A[d] && d<today) miss.push(`${D.cdName[l.cd]||l.cd} · ${l.ph} – ${DOW[days.indexOf(d)]} ${dm(d)}`); }); });
  if(miss.length) items.push(`<b>${miss.length}</b> ô ngày trong tuần (T2–T7) không có báo cáo:<br><span class="sub">${miss.slice(0,8).map(esc).join('<br>')}${miss.length>8?'<br>…':''}</span>`);
  if(D.bad.length) items.push(`<b>${D.bad.length}</b> dòng trong Tam_BaoCaoSanLuong thiếu ngày / công đoạn / mã phôi (không đưa vào báo cáo)`);
  // top tăng/giảm vs tuần trước
  const mv=lines.map(l=>{const a=lineWeek(l.k,S.week,'sl').avg, b=lineWeek(l.k,addDays(S.week,-7),'sl').avg; return {l, r:(a!=null&&b)?(a/b-1)*100:null};}).filter(x=>x.r!=null).sort((a,b)=>b.r-a.r);
  let tops='';
  if(mv.length){ const f=x=>`${esc(D.cdName[x.l.cd]||x.l.cd)} · ${esc(D.phName[x.l.ph]||x.l.ph)}: <b class="${x.r>=0?'pos':'neg'}">${x.r>=0?'+':''}${x.r.toFixed(1)}%</b>`;
    tops=`<h2 style="margin-top:14px">Biến động TB/ngày so với tuần trước</h2><div class="sub">Tăng mạnh nhất</div><ul class="warns">${mv.slice(0,3).map(x=>'<li>'+f(x)+'</li>').join('')}</ul><div class="sub">Giảm mạnh nhất</div><ul class="warns">${mv.slice(-3).reverse().map(x=>'<li>'+f(x)+'</li>').join('')}</ul>`; }
  return `<div class="card"><h2>⚠ Cảnh báo dữ liệu</h2>${items.length?`<ul class="warns">${items.map(i=>'<li class="warn">'+i+'</li>').join('')}</ul>`:'<div class="sub">Không có cảnh báo cho tuần này.</div>'}${tops}</div>`;
}

const COLS=[['d','Ngày'],['cd','Công đoạn'],['ph','Mã hàng'],['ten','Tên'],['sl','SL tăng'],['loi','Lỗi sửa'],['ll','Làm lại'],['rate','% lỗi'],['gc','Ghi chú'],['nbc','Người BC'],['tg','Thời gian nhập']];
function detailRows(){
  const end=addDays(S.week,6), q=S.q.toLowerCase();
  let r=D.recs.filter(o=>o.d>=S.week&&o.d<=end&&(!S.ch||o.ch===S.ch)).map(o=>Object.assign({},o,{ten:D.phName[o.ph]||'',rate:o.sl?(o.loi+o.ll)/o.sl*100:0}));
  const f=S.filter;
  if(f){ if(f.k) r=r.filter(o=>o.cd+'|'+o.ph===f.k && (!f.d||o.d===f.d));
    if(f.t==='late') r=r.filter(o=>o.lag!=null&&o.lag>=2);
    if(f.t==='err') r=r.filter(o=>o.sl&&(o.loi+o.ll)/o.sl>0.1);
    if(f.t==='dup'){ const c={}; r.forEach(o=>{const k=o.cd+o.ph+o.d;c[k]=(c[k]||0)+1}); r=r.filter(o=>c[o.cd+o.ph+o.d]>1); } }
  if(q) r=r.filter(o=>[o.cd,o.ph,o.ten,o.gc,o.nbc,D.cdName[o.cd]].join(' ').toLowerCase().includes(q));
  const {k,dir}=S.sort; r.sort((a,b)=> (a[k]>b[k]?1:a[k]<b[k]?-1:0)*dir || (a.cd>b.cd?1:-1));
  return r;
}
function detailHTML(){
  const r=detailRows(), f=S.filter;
  let chip='';
  if(f){ const t = f.k? `${D.cdName[f.k.split('|')[0]]||''} · ${f.k.split('|')[1]}${f.d?' · '+dmy(f.d):''}` : ({late:'Nhập trễ ≥ 2 ngày',err:'% lỗi > 10%',dup:'Nhiều phiếu cùng ngày'})[f.t];
    chip=`<span class="chip">Lọc: ${esc(t)}<b id="clrF" title="Bỏ lọc">✕</b></span>`; }
  const sum=r.reduce((s,o)=>{s.sl+=o.sl;s.loi+=o.loi;s.ll+=o.ll;return s},{sl:0,loi:0,ll:0});
  let h=`<div class="card" id="detailCard"><div class="top" style="margin-bottom:8px"><h2>Chi tiết phiếu báo cáo (${r.length})</h2>
   <div class="ctrls"><div class="chips">${chip}</div><input id="q" placeholder="Tìm mã, tên, ghi chú, người BC…" value="${esc(S.q)}"><button id="csv">⬇ Xuất CSV</button></div></div>
   <div class="tbl-wrap" style="max-height:520px"><table id="detail"><thead><tr>${COLS.map(([k,t])=>`<th data-sort="${k}">${t}${S.sort.k===k?(S.sort.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>`;
  r.forEach(o=>{ h+=`<tr><td>${dmy(o.d)}</td><td>${esc(D.cdName[o.cd]||o.cd)} <span class="sub">${esc(o.cd)}</span></td><td>${esc(o.ph)}</td><td>${esc(o.ten)}</td>
    <td class="n">${fmtN(o.sl)}</td><td class="n">${o.loi?fmtN(o.loi):''}</td><td class="n">${o.ll?fmtN(o.ll):''}</td>
    <td class="n ${o.rate>10?'neg':''}">${o.rate?o.rate.toFixed(1)+'%':''}</td><td class="gc">${esc(o.gc).replace(/\n/g,'<br>')}</td>
    <td>${esc(o.nbc.split('@')[0])}</td><td>${esc(o.tg)} ${o.lag!=null&&o.lag>=2?`<span class="tag">trễ ${o.lag} ngày</span>`:''}</td></tr>`; });
  if(!r.length) h+=`<tr><td colspan="11" class="state">Không có phiếu phù hợp</td></tr>`;
  else h+=`<tr class="grp"><td colspan="4" class="name">Cộng (lưu ý: cộng chung nhiều đơn vị/mã hàng khác nhau)</td><td class="n">${fmtN(sum.sl)}</td><td class="n">${fmtN(sum.loi)}</td><td class="n">${fmtN(sum.ll)}</td><td class="n">${sum.sl?((sum.loi+sum.ll)/sum.sl*100).toFixed(1)+'%':''}</td><td colspan="3"></td></tr>`;
  return h+'</tbody></table></div></div>';
}

/* ---------- sự kiện ---------- */
function bind(){
  document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{S.metric=b.dataset.metric;render();});
  const bs=document.getElementById('baseSel'); if(bs) bs.onchange=()=>{S.base=bs.value;render();};
  const dc=document.getElementById('devChk'); if(dc) dc.onchange=()=>{S.showDev=dc.checked;render();};
  document.querySelectorAll('.cell').forEach(c=>{
    c.onclick=()=>{ S.filter={k:c.dataset.k,d:c.dataset.d}; render(); document.getElementById('detailCard').scrollIntoView({behavior:'smooth'}); };
    c.onmousemove=e=>showTip(e,c.dataset.tip); c.onmouseleave=hideTip; });
  document.querySelectorAll('[data-flt]').forEach(a=>a.onclick=e=>{e.preventDefault(); S.filter={t:a.dataset.flt}; render(); document.getElementById('detailCard').scrollIntoView({behavior:'smooth'});});
  const cf=document.getElementById('clrF'); if(cf) cf.onclick=()=>{S.filter=null;render();};
  const q=document.getElementById('q'); if(q){ q.oninput=()=>{ S.q=q.value; const pos=q.selectionStart; document.getElementById('detailCard').outerHTML=detailHTML(); bind(); const n=document.getElementById('q'); n.focus(); n.setSelectionRange(pos,pos); }; }
  document.querySelectorAll('#detail th[data-sort]').forEach(th=>th.onclick=()=>{ const k=th.dataset.sort; S.sort = S.sort.k===k? {k,dir:-S.sort.dir} : {k,dir:1}; document.getElementById('detailCard').outerHTML=detailHTML(); bind(); });
  const cv=document.getElementById('csv'); if(cv) cv.onclick=exportCSV;
}
const tip=document.getElementById('tip');
function showTip(e,t){ if(!t) return; tip.textContent=t; tip.style.display='block'; const x=Math.min(e.clientX+12, innerWidth-270); tip.style.left=x+'px'; tip.style.top=(e.clientY+14)+'px'; }
function hideTip(){ tip.style.display='none'; }
function exportCSV(){
  const r=detailRows(); const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines=[COLS.map(c=>q(c[1])).join(',')].concat(r.map(o=>[dmy(o.d),o.cd,o.ph,o.ten,o.sl,o.loi,o.ll,o.rate.toFixed(2),o.gc,o.nbc,o.tg].map(q).join(',')));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ChiTiet_'+weekLabel(S.week).split(' (')[0].replace(/[\/ ]/g,'_')+'.csv'; document.body.appendChild(a); a.click(); a.remove();
}

function setupControls(){
  const ws=document.getElementById('weekSel');
  ws.innerHTML=D.weeks.slice().reverse().map(w=>`<option value="${w}">${weekLabel(w)}</option>`).join('');
  if(!S.week || !D.weeks.includes(S.week)) S.week=D.weeks[D.weeks.length-1];
  ws.value=S.week;
  ws.onchange=()=>{S.week=ws.value; S.filter=null; render();};
  const step=n=>{ const i=D.weeks.indexOf(S.week)+n; if(i>=0&&i<D.weeks.length){S.week=D.weeks[i]; ws.value=S.week; S.filter=null; render();} };
  document.getElementById('prevW').onclick=()=>step(-1);
  document.getElementById('nextW').onclick=()=>step(1);
  const cs=document.getElementById('chSel');
  cs.innerHTML='<option value="">Tất cả chuyền</option>'+D.chs.map(c=>`<option value="${esc(c)}">Chuyền ${esc(D.chName[c]||c)}</option>`).join('');
  cs.value=S.ch; cs.onchange=()=>{S.ch=cs.value; S.filter=null; render();};
  document.getElementById('meta').textContent=`Nguồn: Tam_BaoCaoSanLuong (${D.recs.length} phiếu) · Cập nhật lúc ${D.generatedAt}`;
}

/* ---------- tải dữ liệu ---------- */
function onData(json){
  try{ D=prepare(typeof json==='string'?JSON.parse(json):json);
    if(!D.weeks.length){ document.getElementById('app').innerHTML='Chưa có dữ liệu báo cáo.'; return; }
    setupControls(); render();
  }catch(err){ onErr(err); }
}
function onErr(err){ const a=document.getElementById('app'); a.className='state'; a.innerHTML='Lỗi tải dữ liệu: '+esc(err && err.message || err); }
function load(fresh){
  document.getElementById('meta').textContent='Đang tải dữ liệu…';
  const src = GAS_URL
    ? GAS_URL + (GAS_URL.includes('?') ? '&' : '?') + 'format=json' + (fresh ? '&t=' + Date.now() : '')
    : '/api/data' + (fresh ? '?fresh=1' : '');
  fetch(src,{cache:'no-store'})
    .then(r=>{ if(!r.ok) return r.text().then(t=>{
        if(!GAS_URL && r.status===404) throw new Error('Chưa cấu hình GAS_URL (link Web App Apps Script /exec) trong NS1_BCSL/bao-cao-san-luong.html');
        throw new Error('HTTP '+r.status+' '+t.slice(0,200)); });
      return r.text().then(t=>{ if(t.trim().startsWith('<')) throw new Error('Apps Script không trả JSON. Kiểm tra GAS_URL, bản triển khai mới nhất và quyền truy cập "Bất kỳ ai".'); return JSON.parse(t); }); })
    .then(onData).catch(onErr);
}
document.getElementById('reload').onclick=()=>load(true);
load();
</script>
